
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snow Rider Auto Player</title>
<style>
body{background:#0b1728;color:white;font:16px system-ui;text-align:center;padding:35px 16px}
main{max-width:620px;margin:auto;background:#172941;padding:25px;border-radius:18px}
button,a{display:inline-block;padding:13px 18px;margin:8px;border:0;border-radius:10px;background:#80dcff;color:#092033;font-weight:bold;text-decoration:none;cursor:pointer}
p{color:#c6d4e5;line-height:1.6}
</style>
</head>
<body>
<main>
<h1>🏂 Snow Rider Auto Player</h1>
<p>Launch Snow Rider 3D, then install the game-side controller.</p>
<button id="launch">Open game and start setup ↗</button>
<p id="status">Ready</p>
<hr>
<h3>Controller status</h3>
<p id="info">The game has not been connected.</p>
<p>For safety, test the controller with the game visible.</p>
</main>
<script>
document.getElementById("launch").onclick=()=>{
  const game=window.open(
    "https://www.hoodamath.com/games/snowrider3d.php.html",
    "_blank"
  );
  document.getElementById("status").textContent =
    game ? "Game tab opened" :
    "Popup blocked — allow popups and try again.";
  document.getElementById("info").textContent =
    "Click inside the game. Install the userscript in the next step.";
};
</script>
</body>
</html>
