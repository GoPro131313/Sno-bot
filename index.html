
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snow Rider 3D — Hack Edition</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#bce8ff;font-family:system-ui,sans-serif;color:white}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
.pill{background:#10253ddd;border:1px solid #ffffff44;border-radius:12px;padding:10px 13px;font-weight:bold}
button{cursor:pointer;border:0;border-radius:11px;padding:11px 14px;font-weight:bold}
#hacks{margin-left:auto;pointer-events:auto;background:#ffdc77;color:#243349}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#09233a99;padding:18px}
.card{background:#10253df5;border:1px solid #ffffff35;border-radius:20px;padding:22px;width:min(400px,100%);max-height:90dvh;overflow:auto;box-shadow:0 15px 60px #1238}
h1{margin:0 0 8px;font-size:29px}
p{color:#d1e6f7}
.primary{background:#8cf2c6;width:100%;margin-top:12px;font-size:16px}
#hackPanel{display:none;position:fixed;inset:0;background:#06162acc;align-items:center;justify-content:center;padding:18px}
#hackGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hack{background:#1c3953;color:white;display:flex;justify-content:space-between;align-items:center;gap:5px;padding:10px;border-radius:10px}
.hack button{padding:8px;background:#dceaf6}
.hack button.on{background:#65efb0}
#mobile{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
#mobile button{pointer-events:auto;width:70px;height:64px;background:#10253dc9;color:white;font-size:24px;touch-action:none}
#jump{width:88px!important;font-size:14px!important}
.small{font-size:12px;color:#aac6dc}
</style>
</head>
<body>
<div id="hud">
 <div class="pill">🏔️ <span id="score">0</span> m</div>
 <div class="pill">🎁 <span id="gifts">0</span></div>
 <button id="hacks">⚡ HACKS</button>
</div>
<div id="overlay">
 <div class="card">
  <h1 id="title">🏂 Snow Rider 3D</h1>
  <p id="message">Race down the mountain, dodge obstacles, jump and collect presents!</p>
  <button class="primary" id="start">START RIDING</button>
  <p class="small">← → or A/D: steer · Space/↑: jump · H: hacks</p>
 </div>
</div>
<div id="hackPanel">
 <div class="card">
  <h1>⚡ Hack Center</h1>
  <p>Turn cheats on and off whenever you want.</p>
  <div id="hackGrid"></div>
  <button id="close" class="primary">BACK TO GAME</button>
 </div>
</div>
<div id="mobile">
 <button id="left">◀</button>
 <button id="jump">JUMP ↑</button>
 <button id="right">▶</button>
</div>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbbe7ff);
scene.fog=new THREE.Fog(0xbbe7ff,45,180);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
camera.position.set(0,5.2,10);
camera.lookAt(0,1,-12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe5f6ff,0x8298ac,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.6);
sun.position.set(-8,16,7);
sun.castShadow=true;
scene.add(sun);

const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});
const snow=mat(0xf3faff),edgeMat=mat(0xd7eaf5);
const wood=mat(0x76513b),green=mat(0x165f4b);
const darkGreen=mat(0x104638),red=mat(0xef5265);
const gold=mat(0xffcf48),blue=mat(0x347db2);
const white=mat(0xffffff),rockMat=mat(0x8396a5);

function box(w,h,d,material,x,y,z,parent=scene){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function cylinder(rt,rb,h,material,x,y,z,parent=scene){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,8),material);
 m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}

// Snowy mountain and downhill track.
const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,300),snow);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.12,-85);ground.receiveShadow=true;scene.add(ground);

box(12,.18,300,snow,0,0,-90);
box(.18,.3,300,edgeMat,-6.05,.04,-90);
box(.18,.3,300,edgeMat,6.05,.04,-90);

for(let side of [-1,1]){
 for(let i=0;i<8;i++){
  const mountain=new THREE.Mesh(
   new THREE.ConeGeometry(12+i%3*3,25+i%4*8,5),
   i%2?snow:edgeMat);
  mountain.position.set(side*(15+i%3*8),10+i%4*4,-20-i*25);
  mountain.rotation.y=i*.8;scene.add(mountain);
 }
}

// Sled model.
const sled=new THREE.Group();scene.add(sled);
box(1.05,.12,1.9,red,0,.25,0,sled);
box(.68,.16,1.2,blue,0,.38,-.05,sled);
for(let x of [-.42,.42]){
 const rail=new THREE.Mesh(new THREE.BoxGeometry(.09,.09,2.15),gold);
 rail.position.set(x,.12,0);sled.add(rail);
}
const body=box(.42,.5,.48,blue,0,.69,-.12,sled);
const head=new THREE.Mesh(new THREE.SphereGeometry(.25,16,12),mat(0xf0c6a1));
head.position.set(0,1.03,-.12);sled.add(head);
const helmet=new THREE.Mesh(new THREE.SphereGeometry(.27,16,10,0,Math.PI*2,0,Math.PI/2),red);
helmet.position.set(0,1.12,-.12);sled.add(helmet);
sled.position.set(0,0,2.5);

// Tree, rock and present models.
function tree(){
 const g=new THREE.Group();
 cylinder(.12,.18,1.1,wood,0,.55,0,g);
 for(let i=0;i<3;i++){
  const c=new THREE.Mesh(new THREE.ConeGeometry(.72-i*.14,1.15,7),i===2?darkGreen:green);
  c.position.y=1.05+i*.62;c.castShadow=true;g.add(c);
 }
 return g;
}
function rock(){
 const g=new THREE.Group();
 const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.5,0),rockMat);
 m.position.y=.35;m.scale.set(1,.75,1.2);m.castShadow=true;g.add(m);
 return g;
}
function present(){
 const g=new THREE.Group();
 box(.65,.65,.65,red,0,.38,0,g);
 box(.13,.67,.68,gold,0,.39,0,g);
 box(.67,.67,.13,gold,0,.39,0,g);
 const bow1=new THREE.Mesh(new THREE.TorusGeometry(.15,.045,6,12,Math.PI*1.6),gold);
 bow1.position.set(-.1,.77,0);g.add(bow1);
 const bow2=bow1.clone();bow2.position.x=.1;bow2.rotation.z=Math.PI;g.add(bow2);
 return g;
}
const objects=[];
function spawn(){
 const r=Math.random(),type=r<.48?'tree':r<.72?'rock':r<.86?'gift':'tree';
 const obj=type==='tree'?tree():type==='rock'?rock():present();
 const lane=(Math.random()*1.72-.86)*5.2;
 obj.position.set(lane,0,-115);
 obj.userData={type,hit:false,lane};
 scene.add(obj);objects.push(obj);
}
for(let i=0;i<38;i++){
 const t=tree();t.scale.setScalar(.7+Math.random()*.7);
 t.position.set((Math.random()<.5?-1:1)*(8+Math.random()*24),0,-i*5-10);
 scene.add(t);
}
for(let i=0;i<18;i++)spawn();

const hacks={god:false,speed:false,moon:false,auto:false,magnet:false};
const labels={god:'God Mode',speed:'Speed Hack',moon:'Moon Jump',auto:'Auto Dodge',magnet:'Gift Magnet'};
function buildHacks(){
 $('hackGrid').innerHTML='';
 for(const k in hacks){
  const row=document.createElement('div');row.className='hack';
  const label=document.createElement('span');label.textContent=labels[k];
  const b=document.createElement('button');b.textContent=hacks[k]?'ON':'OFF';
  b.className=hacks[k]?'on':'';
  b.onclick=()=>{hacks[k]=!hacks[k];b.textContent=hacks[k]?'ON':'OFF';b.className=hacks[k]?'on':''};
  row.append(label,b);$('hackGrid').append(row);
 }
}
let running=false,dead=false,dist=0,gifts=0;
let x=0,jumpY=0,jumpV=0,steer=0,spawnTimer=0;
const keys={};
function start(){
 dist=0;gifts=0;x=0;jumpY=0;jumpV=0;
 dead=false;running=true;spawnTimer=0;
 for(const o of objects)scene.remove(o);
 objects.length=0;
 for(let i=0;i<30;i++)spawn();
 sled.position.x=0;
 $('overlay').style.display='none';
 $('hackPanel').style.display='none';
}
function crash(){
 if(hacks.god)return;
 dead=true;running=false;
 $('title').textContent='WIPEOUT!';
 $('message').textContent=`Distance: ${Math.floor(dist)} m · Presents: ${gifts}`;
 $('start').textContent='RIDE AGAIN';
 $('overlay').style.display='flex';
}
$('start').onclick=start;
$('hacks').onclick=()=>{running=false;$('hackPanel').style.display='flex';buildHacks()};
$('close').onclick=()=>{$('hackPanel').style.display='none';if(!dead)running=true};

function jump(){
 if(running&&jumpY<=0){jumpV=hacks.moon?.42:.24}
}
addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();
 keys[e.key.toLowerCase()]=true;
 if(e.key==='ArrowLeft')keys.left=true;
 if(e.key==='ArrowRight')keys.right=true;
 if(e.key===' '||e.key==='ArrowUp')jump();
 if(e.key.toLowerCase()==='h'){
  if($('hackPanel').style.display==='flex')$('close').click();
  else $('hacks').click();
 }
 if(e.key==='Enter'&&(dead||!running))start();
});
addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
 if(e.key==='ArrowLeft')keys.left=false;
 if(e.key==='ArrowRight')keys.right=false;
});
function hold(id,k){
 const el=$(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
 for(const ev of ['pointerup','pointercancel','pointerleave'])
 el.addEventListener(ev,()=>keys[k]=false);
}
hold('left','left');hold('right','right');
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});

let last=0;
function animate(t){
 requestAnimationFrame(animate);
 const dt=Math.min((t-last)/16.67||1,2);last=t;
 if(running&&!dead){
  const speed=(hacks.speed?1.8:1)*(1+Math.min(dist/1800,.65));
  dist+=speed*dt*.65;
  steer=(keys.right||keys.d?1:0)-(keys.left||keys.a?1:0);
  if(hacks.auto){
   const obstacle=objects.find(o=>o.userData.type!=='gift'&&o.position.z> -15&&o.position.z< -5&&Math.abs(o.position.x-x)<1.5);
   if(obstacle)steer=x<obstacle.position.x?-1:1;
  }
  x+=steer*.19*dt;
  x=THREE.MathUtils.clamp(x,-5.3,5.3);
  sled.position.x=x;sled.position.y=jumpY;
  sled.rotation.z=-steer*.12;
  jumpY+=jumpV*dt;jumpV-=.018*dt;
  if(jumpY<0){jumpY=0;jumpV=0}
  spawnTimer-=dt;
  if(spawnTimer<=0){spawn();spawnTimer=Math.max(8,22-dist/450)}
  for(const o of objects){
   o.position.z+=speed*.72*dt;
   if(o.userData.type==='gift'&&hacks.magnet&&o.position.z> -15){
    o.position.x=THREE.MathUtils.lerp(o.position.x,x,.08);
   }
   if(!o.userData.hit&&o.position.z>0.5&&o.position.z<4&&Math.abs(o.position.x-x)<(o.userData.type==='tree'?1.05:1.0)){
    o.userData.hit=true;
    if(o.userData.type==='gift'){
     gifts++;scene.remove(o);
    }else if(o.userData.type==='rock'&&jumpY>.65){
     // Jump clears low rocks.
    }else crash();
   }
  }
  for(let i=objects.length-1;i>=0;i--){
   if(objects[i].position.z>12){
    scene.remove(objects[i]);objects.splice(i,1);
   }
  }
  $('score').textContent=Math.floor(dist);
  $('gifts').textContent=gifts;
 }
 // Chase camera with a little responsive movement.
 camera.position.x=THREE.MathUtils.lerp(camera.position.x,x*.45,.06);
 camera.lookAt(x*.25,1.1,-12);
 renderer.render(scene,camera);
}
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
buildHacks();requestAnimationFrame(animate);
</script>
</body>
</html>
